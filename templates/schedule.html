<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Schedule</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
<div class="container mt-5">
    <h1 class="mb-4">Robotics Schedule</h1>

    <div class="table-responsive">
        <table class="table table-striped table-bordered">
            <thead class="table-dark">
                <tr>
                    <th>Time</th>
                    <th>Table</th>
                    <th>Run</th>
                    <th>Team</th>
                </tr>
            </thead>

            <tbody>
                {% for run in schedule %}
                <tr>
                    <td>{{ run.time }}</td>
                    <td>{{ run.table }}</td>
                    <td>{{ run.run }}</td>
                    <td>{{ run.team_number }} - {{ run.team_name }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>

    <a href="/" class="btn btn-secondary">Create Another Schedule</a>
</div>

</body>
</html>
