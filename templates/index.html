<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>
        Robotics Schedule Generator
    </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"> <!--Bootstrap CSS and styling-->
</head>

<body>
<div class="container mt-5">
    <div class="card shadow-sm">
        <div class="card-body">

            <h1 class="mb-4">
                Robotics Schedule Generator
            </h1>

            <form method="POST" enctype="multipart/form-data">

                <div class="mb-3">
                    <label for="file" class="form-label">Team CSV</label>
                    <input type="file" class="form-control" id="file" name="file" accept=".csv" required> <!--Only accepts CSV files, nothing else-->
                </div>

                <div class="mb-3">
                    <label for="tables" class="form-label">Number of Tables</label>
                    <input type="number" class="form-control" id="tables" name="tables" min="1" required>
                </div>

                <div class="mb-3">
                    <label for="start_time" class="form-label">Starting Time</label>
                    <input type="time" class="form-control" id="start_time" name="start_time" value="09:00" required>
                </div>

                <button type="submit" class="btn btn-primary">Generate Schedule</button> <!--Final submission button-->

            </form>
        </div>
    </div>
</div>
</body>
</html>
